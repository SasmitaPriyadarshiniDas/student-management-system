server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 30s
      routes:
        - id: student-service
          uri: ${STUDENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/students/**
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/documents/**
        - id: enrollment-service-courses
          uri: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/courses/**
        - id: enrollment-service-enrollments
          uri: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/enrollments/**

sms:
  security:
    issuer: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
    jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
    audiences: ${API_AUDIENCE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
