server:
  port: 8082

spring:
  application:
    name: document-service
  config:
    import: classpath:sms-common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document_db}
    username: ${DB_USER:sms}
    password: ${DB_PASSWORD:sms}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

sms:
  clients:
    student-service:
      url: ${STUDENT_SERVICE_URL:http://localhost:8081}
  documents:
    required-types: ID_PROOF,TRANSCRIPT         # all of these must be VERIFIED to complete onboarding
    allowed-content-types: application/pdf,image/jpeg,image/png
    max-size-bytes: 10485760
  storage:
    # Local (Azurite) or any key based account:
    connection-string: ${STORAGE_CONNECTION_STRING:}
    # Azure with Managed Identity (leave connection-string empty):
    endpoint: ${STORAGE_ENDPOINT:}
    container: student-documents
    create-container: true
