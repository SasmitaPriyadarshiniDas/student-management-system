# Imported by every servlet service via:  spring.config.import: classpath:sms-common.yml
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}      # Azure Cache for Redis: REDIS_SSL=true, REDIS_PORT=6380
      # password: set via env var SPRING_DATA_REDIS_PASSWORD
  cache:
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

sms:
  cache:
    ttl: 10m
  security:
    issuer: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
    jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
    audiences: ${API_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
