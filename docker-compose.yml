x-service-env: &service-env
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:?set AZURE_TENANT_ID in .env}
  API_AUDIENCE: ${API_AUDIENCE:?set API_AUDIENCE in .env}
  DB_USER: sms
  DB_PASSWORD: sms
  REDIS_HOST: redis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]

  student-service:
    build: { context: ., args: { MODULE: student-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/student_db
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  document-service:
    build: { context: ., args: { MODULE: document-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/document_db
      STUDENT_SERVICE_URL: http://student-service:8081
      # Well-known public Azurite development credentials (local only)
      STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      azurite: { condition: service_started }

  enrollment-service:
    build: { context: ., args: { MODULE: enrollment-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/enrollment_db
      STUDENT_SERVICE_URL: http://student-service:8081
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?set AZURE_TENANT_ID in .env}
      API_AUDIENCE: ${API_AUDIENCE:?set API_AUDIENCE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STUDENT_SERVICE_URL: http://student-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
    depends_on: [student-service, document-service, enrollment-service]

volumes:
  pgdata:
